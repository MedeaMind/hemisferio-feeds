name: Fetch feeds

on:
  schedule:
    - cron: "0 6 * * *"      # todos los días a las 06:00 UTC (08:00 Madrid)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_feeds.py
      - name: Guardar resultados
        run: |
          git config user.name "hemisferio-bot"
          git config user.email "bot@hemisferio.local"
          git add data/
          git commit -m "feeds $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git push
